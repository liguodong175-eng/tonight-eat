<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#100d16" />
  <meta name="description" content="今晚吃什么？从你的饭店清单中公平抽取一家。" />
  <title>今晚吃什么 · 饭店抽签</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="site-shell" id="app">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="今晚吃什么，返回顶部"><span class="brand-mark">食</span><span>今晚吃什么<span class="brand-dot">.</span></span></a>
      <details class="backup-menu" id="backup-menu">
        <summary aria-label="打开数据备份菜单">···</summary>
        <div class="backup-popover">
          <strong>数据备份</strong>
          <p>饭店和记录保存在当前浏览器。</p>
          <button type="button" id="export-button">导出备份</button>
          <button type="button" id="import-button">导入备份</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </div>
      </details>
    </header>

    <main id="top" class="dashboard">
      <div class="page-heading">
        <div><h1>今晚吃什么<span>？</span></h1></div>
        <p class="page-status"><span class="status-light" aria-hidden="true"></span><strong id="eligible-count">0</strong> 家饭店可抽</p>
      </div>

      <div class="workspace-grid">
        <section class="decision-card" id="decision-section" aria-labelledby="decision-title">
          <div class="card-heading"><h2 id="decision-title">今晚吃哪家</h2><span id="candidate-count" class="subtle-count">0 家可抽</span></div>
          <div class="decision-content">
            <div class="reveal-column">
              <div class="reveal-stage">
                <div class="reveal-decoration" aria-hidden="true"><span>✦</span><span>✧</span><span>✦</span></div>
                <div id="reveal-display" class="reveal-panel">
                  <div class="reveal-kicker">TONIGHT'S PICK</div>
                  <div class="reveal-placeholder"><strong>准备好决定今晚了吗？</strong><span>从当前候选中公平抽取一家</span></div>
                </div>
              </div>
              <p id="draw-announcement" class="sr-only" aria-live="polite"></p>
              <div id="draw-empty" class="draw-empty" hidden></div>
              <button id="draw-button" class="draw-button" type="button">抽一家，决定今晚 ✦</button>
              <p class="fair-note">当前候选等概率抽取</p>
            </div>
            <div class="decision-aside">
              <div id="result-card" class="result-card" hidden></div>
              <div id="pending-reminder" class="pending-reminder" hidden></div>
              <details id="adjust-panel" class="adjust-panel">
                <summary><span>调整候选</span><span id="adjust-count" class="adjust-count">可选</span><span class="chevron" aria-hidden="true">⌄</span></summary>
                <div class="adjust-body">
                  <label for="taste-filter">菜系 / 口味<select id="taste-filter"><option value="">全部口味</option></select></label>
                  <div class="adjust-row"><span>今晚先不吃</span><button id="reset-candidate-filters" type="button">重置条件</button></div>
                  <div id="candidate-list" class="candidate-list"></div>
                  <p>临时排除只在当前页面有效。</p>
                </div>
              </details>
            </div>
          </div>
        </section>

        <section class="collection-card" id="restaurants-section" aria-labelledby="restaurants-title">
          <div class="card-heading"><h2 id="restaurants-title">我的饭店</h2><span id="restaurant-count" class="subtle-count">0 家</span></div>
          <details id="add-panel" class="add-panel">
            <summary><span>＋</span> 添加饭店</summary>
            <form id="add-form" class="stack-form">
              <label>饭店名字 <span>*</span><input name="name" required maxlength="60" placeholder="例如：街角川菜馆" autocomplete="off" /></label>
              <label>菜系 / 类型<input name="cuisine" maxlength="40" placeholder="例如：川菜、火锅" autocomplete="off" /></label>
              <label class="check-row"><input name="alreadyVisited" type="checkbox" /><span>以前吃过这家 <small>记入吃过记录，暂不参与抽奖</small></span></label>
              <button type="submit" class="form-submit">保存饭店 ↗</button>
            </form>
          </details>
          <div id="restaurant-list" class="restaurant-list"></div>
          <div class="collection-footer"><span id="library-summary">共 0 家</span><button id="restore-all" type="button">全部恢复可抽</button></div>
          <details id="history-panel" class="history-panel">
            <summary>吃过记录 <span id="visited-count">0</span><span class="chevron" aria-hidden="true">⌄</span></summary>
            <div id="history-list" class="history-list"></div>
          </details>
        </section>
      </div>
    </main>
  </div>

  <dialog id="edit-dialog" class="edit-dialog">
    <form id="edit-form" class="stack-form">
      <div class="dialog-top"><h2>编辑饭店</h2><button id="close-dialog" type="button" aria-label="关闭编辑窗口">×</button></div>
      <input name="id" type="hidden" />
      <label>饭店名字 <span>*</span><input name="name" required maxlength="60" /></label>
      <label>菜系 / 类型<input name="cuisine" maxlength="40" /></label>
      <button class="form-submit" type="submit">保存修改 ↗</button>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
